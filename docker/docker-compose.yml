version: '3.9'

services:
  forum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nanoforum
    restart: unless-stopped
    ports:
      - "8084:8080"
    volumes:
      - forum-data:/app/data
    environment:
      - DB_PATH=/app/data/forum.db
      - BASE_PATH=/forum

  createuser:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["./createuser"]
    profiles: ["tools"]
    volumes:
      - forum-data:/app/data
    environment:
      - DB_PATH=/app/data/forum.db
    stdin_open: true
    tty: true

volumes:
  forum-data:
    driver: local